[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillkit"
version = "0.1.0"
description = "Index, author, and link Agent Skills into IDE folders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
skillkit = "skillkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillkit*"]
